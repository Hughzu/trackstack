services:
  identity-api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: go run ./cmd/identity-api
    volumes:
      - ./apps/server:/app
      - microservices_go_mod:/opt/gomodcache
    ports:
      - "18081:18081"
    env_file:
      - ./apps/server/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 18081
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  heat-api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: go run ./cmd/heat-api
    volumes:
      - ./apps/server:/app
      - microservices_go_mod:/opt/gomodcache
    ports:
      - "18080:18080"
    env_file:
      - ./apps/server/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 18080
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  calories-api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: go run ./cmd/calories-api
    volumes:
      - ./apps/server:/app
      - microservices_go_mod:/opt/gomodcache
    ports:
      - "18082:18082"
    env_file:
      - ./apps/server/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 18082
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  expenses-api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: go run ./cmd/expenses-api
    volumes:
      - ./apps/server:/app
      - microservices_go_mod:/opt/gomodcache
    ports:
      - "18083:18083"
    env_file:
      - ./apps/server/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 18083
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18083/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-edge:
    image: nginx:1.29-alpine
    depends_on:
      identity-api:
        condition: service_healthy
      heat-api:
        condition: service_healthy
      calories-api:
        condition: service_healthy
      expenses-api:
        condition: service_healthy
    volumes:
      - ./infra/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:8088"

  web-frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_pnpm_store:/pnpm/store
    ports:
      - "5173:5173"
    environment:
      API_PROXY_URL: http://api-edge:8088
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      VITE_PORT: 5173
    env_file:
      - ./apps/web/.env.local
    depends_on:
      api-edge:
        condition: service_started

volumes:
  microservices_go_mod:
  web_node_modules:
  web_pnpm_store:
