services:
  # go-backend:
  #   build:
  #     context: ./apps/server
  #     dockerfile: Dockerfile.dev
  #   volumes:
  #     - ./apps/server:/app
  #     # prevent local vendor/mod issues if any
  #     - server_go_modules:/go/pkg/mod
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - ./apps/server/.env

  go-backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/server:/app
    ports:
      - "8080:8080"
    env_file:
      - ./apps/server/.env

  web-frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_pnpm_store:/pnpm/store
    ports:
      - "5173:5173"
    environment:
      - API_PROXY_URL=http://go-backend:8080
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - VITE_PORT=5173
    env_file:
      - ./apps/web/.env.local
    depends_on:
      - go-backend

volumes:
  web_node_modules:
  web_pnpm_store:
