  #   build:
  #     context: ./apps/server
  #     dockerfile: Dockerfile.dev
  #   volumes:
  #     - ./apps/server:/app
  #     # prevent local vendor/mod issues if any
  #     - server_go_modules:/go/pkg/mod
  #   ports:
  #     - "8080:8080"
