name: Deploy Serverless Next

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-serverless-next
  cancel-in-progress: true

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      migrations: ${{ steps.filter.outputs.migrations }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            server:
              - 'apps/server/**'
            migrations:
              - 'packages/db/migrations/**'
            deploy:
              - 'apps/web/**'
              - 'apps/server/**'
              - '.github/workflows/deploy-serverless.yml'

  migrate:
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: changes
    env:
      TURSO_USERS_URL: ${{ secrets.TURSO_USERS_URL }}
      TURSO_USERS_TOKEN: ${{ secrets.TURSO_USERS_TOKEN }}
      TURSO_CALORIES_URL: ${{ secrets.TURSO_CALORIES_URL }}
      TURSO_CALORIES_TOKEN: ${{ secrets.TURSO_CALORIES_TOKEN }}
      TURSO_EXPENSES_URL: ${{ secrets.TURSO_EXPENSES_URL }}
      TURSO_EXPENSES_TOKEN: ${{ secrets.TURSO_EXPENSES_TOKEN }}
      TURSO_HEAT_URL: ${{ secrets.TURSO_HEAT_URL }}
      TURSO_HEAT_TOKEN: ${{ secrets.TURSO_HEAT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply migrations with rollback
        working-directory: packages/db/migrations
        run: |
          set -e
          if ! atlas migrate apply --env users; then
            echo "Migration failed for users."
            # Rollback disabled in community Atlas.
            # atlas migrate down --env users 1 || true
            exit 1
          fi

          if ! atlas migrate apply --env expenses; then
            echo "Migration failed for expenses."
            # Rollback disabled in community Atlas.
            # atlas migrate down --env expenses 1 || true
            exit 1
          fi

          if ! atlas migrate apply --env heat; then
            echo "Migration failed for heat."
            # Rollback disabled in community Atlas.
            # atlas migrate down --env heat 1 || true
            exit 1
          fi

          if ! atlas migrate apply --env calories; then
            echo "Migration failed for calories."
            # Rollback disabled in community Atlas.
            # atlas migrate down --env calories 1 || true
            exit 1
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [changes, migrate]
    env:
      SSM_PREFIX: /trackstack/serverless-next
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Build Astro
        run: pnpm build
        working-directory: apps/web

      - name: Build Go Lambda bootstrap
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/bootstrap ./cmd/lambda
        working-directory: apps/server

      - name: Package Go Lambda artifact
        run: zip -j /tmp/go-api-lambda.zip /tmp/bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-${{ github.run_number }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Load infra config from SSM
        run: |
          set -e
          ASSETS_BUCKET=$(aws ssm get-parameter --name "$SSM_PREFIX/infra/assets_bucket" --query Parameter.Value --output text)
          ARTIFACTS_BUCKET=$(aws ssm get-parameter --name "$SSM_PREFIX/infra/artifacts_bucket" --query Parameter.Value --output text)
          LAMBDA_KEY=$(aws ssm get-parameter --name "$SSM_PREFIX/infra/lambda_key" --query Parameter.Value --output text)
          LAMBDA_FUNCTION_NAME=$(aws ssm get-parameter --name "$SSM_PREFIX/infra/lambda_function_name" --query Parameter.Value --output text)
          CLOUDFRONT_DISTRIBUTION_ID=$(aws ssm get-parameter --name "$SSM_PREFIX/infra/cloudfront_distribution_id" --query Parameter.Value --output text)

          echo "ASSETS_BUCKET=$ASSETS_BUCKET" >> $GITHUB_ENV
          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV
          echo "LAMBDA_KEY=$LAMBDA_KEY" >> $GITHUB_ENV
          echo "LAMBDA_FUNCTION_NAME=$LAMBDA_FUNCTION_NAME" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_ENV

      - name: Upload Lambda artifact
        run: |
          aws s3 cp /tmp/go-api-lambda.zip \
            s3://$ARTIFACTS_BUCKET/$LAMBDA_KEY

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --s3-key "$LAMBDA_KEY"

      - name: Wait for Lambda update
        run: aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Upload immutable static assets
        run: |
          if [ -d apps/web/dist/_astro ]; then
            aws s3 sync apps/web/dist/_astro \
              s3://$ASSETS_BUCKET/_astro \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

          if [ -d apps/web/dist/assets ]; then
            aws s3 sync apps/web/dist/assets \
              s3://$ASSETS_BUCKET/assets \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Upload static HTML and app shell
        run: |
          aws s3 sync apps/web/dist \
            s3://$ASSETS_BUCKET \
            --delete \
            --exclude "_astro/*" \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
