name: Terraform Serverless

on:
  push:
    branches: [main]
    paths:
      - 'infra/environments/serverless/**'
      - 'infra/modules/**'
      - '.github/workflows/terraform-serverless.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      bootstrap_artifact:
        description: 'Build Go Lambda bootstrap artifact before plan/apply'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/serverless


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Setup Go
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap_artifact == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: Build Go Lambda bootstrap artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap_artifact == 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/bootstrap ./cmd/lambda
          zip -j /tmp/go-api-lambda.zip /tmp/bootstrap
        working-directory: apps/server

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Terraform-${{ github.run_number }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TFSTATE_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action != 'destroy'
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            ${BOOTSTRAP_LAMBDA_PATH:+-var="lambda_artifact_path=$BOOTSTRAP_LAMBDA_PATH"}
          PLAN_EXIT_CODE=$?
          set -e

          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Terraform Apply (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && steps.plan.outputs.has_changes == 'true'
        run: terraform apply tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}"
    env:
      BOOTSTRAP_LAMBDA_PATH: ${{ github.event.inputs.bootstrap_artifact == 'true' && '/tmp/go-api-lambda.zip' || '' }}
