name: Terraform Step 0.5 Astro SSR

on:
  push:
    branches: [main]
    paths:
      - 'iac/environments/step-0-5-astro-ssr/**'
      - '.github/workflows/terraform-step-0-5-astro-ssr.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      bootstrap_artifact:
        description: 'Build and upload Lambda artifact before apply'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iac/environments/step-0-5-astro-ssr


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.5
          terraform_wrapper: false

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap_artifact == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Enable pnpm (corepack)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap_artifact == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Build Astro (bootstrap artifact)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap_artifact == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cd dist/server
          zip -r /tmp/astro-ssr.zip .
        working-directory: src/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Terraform-${{ github.run_number }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TFSTATE_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            ${BOOTSTRAP_LAMBDA_PATH:+-var="lambda_artifact_path=$BOOTSTRAP_LAMBDA_PATH"}
          PLAN_EXIT_CODE=$?
          set -e

          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Terraform Apply (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && steps.plan.outputs.has_changes == 'true'
        run: terraform apply tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}"
    env:
      BOOTSTRAP_LAMBDA_PATH: ${{ github.event.inputs.bootstrap_artifact == 'true' && '/tmp/astro-ssr.zip' || '' }}
