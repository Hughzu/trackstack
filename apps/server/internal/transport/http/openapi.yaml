openapi: 3.0.3
info:
  title: Trackstack API
  version: 0.1.0
  description: Initial Go backend API for Trackstack (heat module).
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/heat/refills:
    get:
      summary: List heat refills
      parameters:
        - in: query
          name: from
          description: Start date (YYYY-MM-DD or RFC3339)
          schema:
            type: string
        - in: query
          name: to
          description: End date (YYYY-MM-DD or RFC3339)
          schema:
            type: string
      responses:
        "200":
          description: List of refills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refill"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a heat refill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefillRequest"
      responses:
        "201":
          description: Refill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refill"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a heat refill
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Refill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/expenses/settings:
    get:
      summary: Get expenses settings
      responses:
        "200":
          description: Settings
    post:
      summary: Update expenses settings
      responses:
        "200":
          description: Settings updated
  /api/expenses/sheet/current:
    get:
      summary: Get current expenses sheet dashboard
      responses:
        "200":
          description: Dashboard data
  /api/expenses/entries:
    post:
      summary: Add expense entry
      responses:
        "201":
          description: Entry created
    delete:
      summary: Delete expense entry
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/expenses/checklists:
    post:
      summary: Upsert checklist template
      responses:
        "200":
          description: Template upserted
    delete:
      summary: Delete checklist template
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/expenses/checklists/complete:
    post:
      summary: Complete checklist item
      responses:
        "201":
          description: Entry from checklist item created
  /api/expenses/recurring:
    post:
      summary: Upsert recurring template
      responses:
        "200":
          description: Template upserted
    delete:
      summary: Delete recurring template
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/expenses/sheet/close:
    post:
      summary: Close current expense sheet
      responses:
        "200":
          description: New sheet returned
  /api/calories/log:
    post:
      summary: Create a calorie log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalorieLogRequest"
      responses:
        "201":
          description: Log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalorieLog"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a calorie log
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/calories/target:
    get:
      summary: Get calorie target
      responses:
        "200":
          description: Target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalorieTarget"
    post:
      summary: Update calorie target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalorieTargetRequest"
      responses:
        "200":
          description: Target updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalorieTarget"
components:
  schemas:
    Refill:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        date:
          type: string
          format: date-time
        weightKg:
          type: number
          format: float
        bags:
          type: integer
        temperature:
          type: number
          format: float
          nullable: true
        season:
          type: string
          nullable: true
      required:
        - id
        - userId
        - date
        - weightKg
        - bags
    CreateRefillRequest:
      type: object
      properties:
        date:
          type: string
          description: RFC3339 or YYYY-MM-DD
        weightKg:
          type: number
          format: float
        bags:
          type: integer
        temperature:
          type: number
          format: float
          nullable: true
      required:
        - date
        - weightKg
        - bags
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CalorieLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        dateTime:
          type: string
          format: date-time
        calories:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
          nullable: true
        fatG:
          type: integer
          nullable: true
        title:
          type: string
          nullable: true
      required:
        - id
        - userId
        - dateTime
        - calories
        - proteinG
    CalorieTarget:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        targetKcal:
          type: integer
        targetProteinG:
          type: integer
        targetCarbsG:
          type: integer
          nullable: true
        targetFatG:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - targetKcal
        - targetProteinG
        - createdAt
        - updatedAt
    CreateCalorieLogRequest:
      type: object
      properties:
        calories:
          type: integer
        protein:
          type: integer
        carbs:
          type: integer
          nullable: true
        fat:
          type: integer
          nullable: true
        title:
          type: string
          nullable: true
        date:
          type: string
          description: YYYY-MM-DD
      required:
        - calories
        - protein
    UpdateCalorieTargetRequest:
      type: object
      properties:
        targetKcal:
          type: integer
        targetProtein:
          type: integer
        targetCarbs:
          type: integer
          nullable: true
        targetFat:
          type: integer
          nullable: true
      required:
        - targetKcal
        - targetProtein
